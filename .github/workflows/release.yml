name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for Trusted Publisher OIDC support
        # npm 10.x (ships with Node 22) does not support OIDC token exchange for
        # Trusted Publisher publishes. Provenance signing works, but the PUT itself
        # is unauthenticated and returns a misleading 404. npm 11.5.1+ is required.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Test coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Build CLI
        run: npm run build:cli

      - name: CLI smoke test
        run: node dist/cli/index.js --help

      - name: Validate package exports (publint)
        run: npx publint

      - name: Validate type resolution (attw)
        # attw + fflate@0.8.2 pinned via package.json overrides (fflate 0.8.3 broke attw, see arethetypeswrong/arethetypeswrong.github.io#258)
        run: npm exec -- attw --pack . --ignore-rules cjs-resolves-to-esm no-resolution

      - name: Verify package contents
        run: |
          OUTPUT=$(npm pack --dry-run 2>&1)
          if echo "$OUTPUT" | grep -qE '(tests/|\.claude/|\.env|\.dev\.vars)'; then
            echo "::error::Unwanted files in package tarball"
            exit 1
          fi

      - name: Lockfile registry validation
        run: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --allowed-schemes "https:"

      - name: Publish to npm
        # Authenticates via npm Trusted Publisher (OIDC) using the id-token: write permission above.
        # Trusted Publisher entry on npmjs.com for @littlebearapps/cf-monitor delegates
        # `npm publish` permission to this workflow (org=littlebearapps, repo=cf-monitor,
        # workflow=release.yml, env=empty). --provenance attaches SLSA build provenance
        # attestation visible as a verified-build badge on the npm package page.
        # NPM_TOKEN repo secret can be revoked once the first OIDC publish succeeds.
        run: npm publish --access public --provenance

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > /tmp/release-notes.md
          printf '\n---\n```bash\nnpm install @littlebearapps/cf-monitor@%s\n```\n' "$VERSION" >> /tmp/release-notes.md

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
